[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-environment-bootstrap"
version = "0.1.0"
description = "Python CLI to diagnose and bootstrap a developer environment."
requires-python = ">=3.13"

[project.scripts]
devenv = "devenv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]